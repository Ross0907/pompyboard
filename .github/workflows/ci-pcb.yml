on:
  push:
    paths:
      - pcb/**
  pull_request:
    paths:
      - pcb/**
  workflow_dispatch:

name: PCB CI
jobs:
  ci:
    name: PCB CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          experimental: true
          working_directory: pcb

      - run: bun i
        working-directory: pcb

      - run: bunx prettier -l .
        working-directory: pcb

      - run: bun run build
        working-directory: pcb

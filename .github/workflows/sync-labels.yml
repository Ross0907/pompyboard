name: Sync Labels

on:
  push:
    branches:
      - dev
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml # this file
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/labels.yml

      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true

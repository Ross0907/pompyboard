# https://cspell.org/docs/Configuration/properties

version: "0.2"
useGitignore: true
enableGlobDot: true
ignorePaths:
  - .git/
  - "*/.cargo/*"
  - "*.kicad_mod"
  - "*.kicad_pcb"
  - "*.kicad_prl"
  - "*.kicad_pro"
  - "*.kicad_sch"
  - "*.kicad_sym"
  - "*.step"
  - "*.STEP"
  - "*.svd"
  - "**/parts/**/*.ato"
  - "*fp-lib-table"
ignoreRegExpList:
  # don't spell check vscode extension IDs
  - '"editor.defaultFormatter"\s*:\s*"[^"]*"'
  - '"recommendations"\s*:\s*\[[\s\S]*?\]'

version: "0.2"
useGitignore: true
enableGlobDot: true
ignorePaths:
  - .git/
  - "*/.cargo/*"
  - "*.kicad_mod"
  - "*.kicad_pcb"
  - "*.kicad_prl"
  - "*.kicad_pro"
  - "*.kicad_sch"
  - "*.kicad_sym"
  - "*.step"
  - "*.STEP"
  - "*.svd"
  - "*fp-lib-table"
ignoreRegExpList:
  - '"editor.defaultFormatter"\s*:\s*"[^"]*"'
  - '"recommendations"\s*:\s*\[[\s\S]*?\]'
